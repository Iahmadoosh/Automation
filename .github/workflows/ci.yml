name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Chromium for the end-to-end tests
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: >-
          python -m ruff format --check core adapters/browser_utils.py adapters/coop_*.py
          adapters/uottawa_*.py engine/resume.py engine/screening.py coop.py tests

      - name: Run tests
        run: python -m pytest -rs
